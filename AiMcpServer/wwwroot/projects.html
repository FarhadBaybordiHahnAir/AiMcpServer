<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects - MCP Server</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/api.js" defer></script>
  <script src="/projects.js" defer></script>
</head>
<body>
  <main class="projects-page">
    <nav class="page-navigation" aria-label="Project navigation">
      <a href="/projects.html" aria-current="page">Projects</a>
    </nav>
    <header><h1>Projects</h1></header>
    <section aria-labelledby="projects-heading">
      <div class="section-heading">
        <h2 id="projects-heading">Your projects</h2>
        <a class="button-link" href="/new-project.html">New project</a>
        <button id="refresh-projects" type="button">Refresh</button>
      </div>
      <p>Click a project row to view, add, or remove its documents.</p>
      <div id="projects"><p>Loading projects...</p></div>
    </section>
    <p id="status" role="status" aria-live="polite">Loading projects...</p>
  </main>

</html>
